<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Final v3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-bg: #f8fafc; --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); }
        body { background-color: var(--admin-bg); }
        .admin-container { max-width: 1300px; width: 95%; margin-top: 20px; }
        .dashboard-card { background: white; border-radius: 16px; box-shadow: var(--card-shadow); padding: 30px; border: 1px solid rgba(0,0,0,0.05); }
        .results-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
        .results-table th { background: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding: 15px; border-bottom: 2px solid #e2e8f0; }
        .results-table td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-size: 0.9rem; }
        .student-row { cursor: pointer; transition: background 0.2s; }
        .student-row:hover { background-color: #f1f5f9 !important; }
        .grade-badge { background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
        .status-pill { padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .pill-pending { background: #fff7ed; color: #c2410c; }
        .pill-graded { background: #f0fdf4; color: #15803d; }
        .row-detail { display: none; background-color: #fdfdfd; }
        .grading-box { background: white; padding: 25px; border: 1px solid #e2e8f0; border-radius: 16px; margin: 10px 15px 25px 15px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .mcq-review { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 25px; }
        .mcq-item { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #f1f5f9; font-size: 0.85rem; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
        .action-btn { border: none; background: none; cursor: pointer; padding: 8px; color: #64748b; }
        .action-btn:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container admin-container">
        <!-- Admin Login -->
        <div id="admin-login" class="login-box dashboard-card" style="max-width: 400px; margin: 100px auto;">
            <h2 style="text-align:center; margin-bottom: 25px;">Teacher Access</h2>
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="Password" style="border: 1px solid #e2e8f0; padding: 14px;">
            </div>
            <button id="login-btn" class="btn-main" style="padding: 14px; border-radius: 12px;">Unlock Dashboard</button>
        </div>

        <!-- Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <div class="dashboard-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h1 style="margin: 0; font-size: 1.6rem;">Exam Management</h1>
                    <button onclick="location.reload()" class="action-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Class</th>
                            <th>MCQ (20)</th>
                            <th>SC (20)</th>
                            <th>Total</th>
                            <th>Grade</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let answerKey = [];
        const db = firebase.database();

        // Restore Enter Key Support
        document.getElementById('admin-password').addEventListener('keydown', (e) => {
            if(e.key === 'Enter') document.getElementById('login-btn').click();
        });

        document.getElementById('login-btn').onclick = () => {
            if (document.getElementById('admin-password').value === 'admin') {
                // Fetch Answer Key first, then load results
                db.ref('answer_key').once('value').then(snap => {
                    answerKey = snap.val();
                    if(!answerKey) {
                        alert("Error: answer_key not found in Firebase!");
                        return;
                    }
                    document.getElementById('admin-login').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    loadResults();
                });
            } else { alert("Access Denied"); }
        };

        function getGrade(score) {
            if (score <= 10) return 4;
            if (score <= 15) return 5;
            if (score <= 20) return 6;
            if (score <= 25) return 7;
            if (score <= 30) return 8;
            if (score <= 36) return 9;
            return 10;
        }

        function loadResults() {
            db.ref('quiz_results').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('admin-tbody');
                tbody.innerHTML = '';
                if (!data) return;

                Object.keys(data).sort((a,b) => new Date(data[b].timestamp) - new Date(data[a].timestamp)).forEach(key => {
                    const item = data[key];
                    
                    // Calculate MCQ score dynamically using the Answer Key
                    let correctCount = 0;
                    item.studentChoices.forEach((choice, i) => {
                        if (choice.userAnswerIndex === answerKey[i]) correctCount++;
                    });
                    const mcqPoints = correctCount * 1;
                    const scPoints = item.scenarioScore || 0;
                    const totalPoints = mcqPoints + scPoints;
                    const finalGrade = getGrade(totalPoints);

                    const tr = document.createElement('tr');
                    tr.className = 'student-row';
                    tr.onclick = (e) => { if(!e.target.closest('.action-btn')) toggleDetails(key); };
                    tr.innerHTML = `
                        <td style="font-weight: 600;">${item.user.fname} ${item.user.lname}</td>
                        <td>${item.user.classInfo}</td>
                        <td>${mcqPoints}</td>
                        <td>${scPoints}</td>
                        <td><strong style="color:var(--primary)">${totalPoints}</strong></td>
                        <td><span class="grade-badge">${finalGrade}</span></td>
                        <td><span class="status-pill ${item.isGraded ? 'pill-graded' : 'pill-pending'}">${item.isGraded ? 'Graded' : 'Pending'}</span></td>
                        <td style="text-align:center;">
                            <button class="action-btn" onclick="toggleDetails('${key}')"><i class="fas fa-chevron-down"></i></button>
                            <button class="action-btn" onclick="deleteRecord('${key}')" style="color:#e74c3c;"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);

                    const detailTr = document.createElement('tr');
                    detailTr.id = `details-${key}`;
                    detailTr.className = 'row-detail';
                    
                    let mcqHtml = `<div class="mcq-review">`;
                    item.studentChoices.forEach((choice, i) => {
                        const isCorrect = choice.userAnswerIndex === answerKey[i];
                        mcqHtml += `<div class="mcq-item">
                                    <div style="font-weight:700; margin-bottom:5px;">${i+1}. ${choice.question}</div>
                                    <div class="${isCorrect ? 'correct' : 'wrong'}">
                                        <i class="fas ${isCorrect ? 'fa-check' : 'fa-times'}"></i> 
                                        ${choice.userAnswerIndex !== -1 ? choice.options[choice.userAnswerIndex] : 'No Answer'}
                                    </div>
                                    ${!isCorrect ? '<div style="font-size:0.75rem; color:#64748b; margin-top:5px;">Correct: '+choice.options[answerKey[i]]+'</div>' : ''}
                                    </div>`;
                    });
                    mcqHtml += `</div>`;

                    detailTr.innerHTML = `
                        <td colspan="8">
                            <div class="grading-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:15px; margin-bottom:15px;">
                                    <h3 style="margin:0; font-size:1.1rem; color:var(--primary);">Scenario: ${item.scenario.title}</h3>
                                    <button class="btn-main" style="width:auto; margin:0; padding:8px 15px; background:#e67e22;" onclick="sendReport('${key}', ${totalPoints}, ${finalGrade})"><i class="fas fa-paper-plane"></i> Email Report</button>
                                </div>
                                <div style="margin-bottom: 25px; font-size: 0.95rem; line-height: 1.6; color:#475569;">
                                    <p><strong>Security:</strong> ${item.scenario.security}</p>
                                    <p><strong>SDLC:</strong> ${item.scenario.sdlc}</p>
                                    <p><strong>HCI:</strong> ${item.scenario.hci}</p>
                                </div>
                                <div style="background: #f8fafc; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #e2e8f0;">
                                    <strong>Assign Scenario Score (0-20):</strong>
                                    <input type="number" id="sc-grade-${key}" max="20" min="0" value="${scPoints}" style="width:70px; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">
                                    <button class="btn-main" style="width:auto; margin:0; padding:10px 20px;" onclick="submitGrade('${key}', ${mcqPoints})">Save Grade</button>
                                </div>
                                <h4 style="margin: 30px 0 10px 0; font-size: 1rem; color: #64748b;">Multiple Choice Breakdown</h4>
                                ${mcqHtml}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });
        }

        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            const visible = el.style.display === 'table-row';
            document.querySelectorAll('.row-detail').forEach(row => row.style.display = 'none');
            el.style.display = visible ? 'none' : 'table-row';
        }

        function deleteRecord(id) {
            if (confirm("Delete this student record forever?")) {
                db.ref('quiz_results/' + id).remove();
            }
        }

        function submitGrade(id, mcqPoints) {
            const sc = parseFloat(document.getElementById(`sc-grade-${id}`).value) || 0;
            db.ref('quiz_results/' + id).update({ scenarioScore: sc, isGraded: true })
                .then(() => alert("Grade Updated!"));
        }

        function sendReport(key, total, grade) {
            db.ref('quiz_results/' + key).once('value', (snap) => {
                const item = snap.val();
                let report = `REPORT: ${item.user.fname} ${item.user.lname}\nSCORE: ${total}/40\nGRADE: ${grade}\n\n`;
                // Add more details to report string if needed
                fetch("https://formsubmit.co/ajax/mesuesinformatike@gmail.com", {
                    method: "POST",
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ _subject: `Exam Result: ${item.user.fname}`, Report: report })
                }).then(() => alert("Email Sent!"));
            });
        }
    </script>
</body>
</html>
