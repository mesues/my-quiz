<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Zero Knowledge Security</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-bg: #f8fafc; --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); }
        body { background-color: var(--admin-bg); }
        .admin-container { max-width: 1300px; width: 95%; margin-top: 20px; }
        .dashboard-card { background: white; border-radius: 16px; box-shadow: var(--card-shadow); padding: 30px; border: 1px solid rgba(0,0,0,0.05); }
        .results-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
        .results-table th { background: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding: 15px; border-bottom: 2px solid #e2e8f0; }
        .results-table td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-size: 0.9rem; }
        .student-row { cursor: pointer; }
        .student-row:hover { background-color: #f8fafc; }
        .grade-badge { background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
        .status-pill { padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .pill-pending { background: #fff7ed; color: #c2410c; }
        .pill-graded { background: #f0fdf4; color: #15803d; }
        .row-detail { display: none; background: #fdfdfd; }
        .grading-box { background: white; padding: 25px; border: 1px solid #e2e8f0; border-radius: 16px; margin: 10px 15px; }
        .mcq-review { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 25px; }
        .mcq-item { background: white; padding: 15px; border-radius: 12px; border: 1px solid #f1f5f9; font-size: 0.85rem; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container admin-container">
        <div id="admin-login" class="dashboard-card" style="max-width: 400px; margin: 100px auto;">
            <h2 style="text-align:center;">Teacher Access</h2>
            <input type="password" id="admin-password" placeholder="Password" style="margin-bottom:15px; padding:12px;">
            <button id="login-btn" class="btn-main">Unlock</button>
        </div>

        <div id="admin-dashboard" class="hidden">
            <div class="dashboard-card">
                <h1>Exam Management</h1>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>MCQ (30)</th>
                            <th>SC (10)</th>
                            <th>Total</th>
                            <th>Grade</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let answerKey = [];
        const db = firebase.database();

        document.getElementById('login-btn').onclick = () => {
            if (document.getElementById('admin-password').value === 'admin') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                db.ref('answer_key').once('value').then(snap => { answerKey = snap.val(); loadResults(); });
            }
        };

        function getGrade(score) {
            if (score <= 10) return 4;
            if (score <= 15) return 5;
            if (score <= 20) return 6;
            if (score <= 25) return 7;
            if (score <= 30) return 8;
            if (score <= 36) return 9;
            return 10;
        }

        function loadResults() {
            db.ref('quiz_results').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('admin-tbody');
                tbody.innerHTML = '';
                if (!data) return;

                Object.keys(data).sort((a,b) => new Date(data[b].timestamp) - new Date(data[a].timestamp)).forEach(key => {
                    const item = data[key];
                    
                    // CALCULATE MCQ SCORE ON THE FLY
                    let correctCount = 0;
                    item.studentChoices.forEach((choice, i) => {
                        if (choice.userAnswerIndex === answerKey[i]) correctCount++;
                    });
                    const calculatedMcqScore = correctCount * 1.5;
                    const scScore = item.scenarioScore || 0;
                    const totalScore = calculatedMcqScore + scScore;
                    const currentGrade = getGrade(totalScore);

                    const tr = document.createElement('tr');
                    tr.className = 'student-row';
                    tr.onclick = (e) => { if(!e.target.closest('.action-btn')) toggleDetails(key); };
                    tr.innerHTML = `
                        <td>${item.user.fname} ${item.user.lname}</td>
                        <td>${calculatedMcqScore}</td>
                        <td>${scScore}</td>
                        <td><strong>${totalScore}</strong></td>
                        <td><span class="grade-badge">${currentGrade}</span></td>
                        <td><span class="status-pill ${item.isGraded ? 'pill-graded' : 'pill-pending'}">${item.isGraded ? 'Graded' : 'Pending'}</span></td>
                        <td>
                            <button class="action-btn" onclick="toggleDetails('${key}')"><i class="fas fa-chevron-down"></i></button>
                            <button class="action-btn" onclick="deleteRecord('${key}')" style="color:red;"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);

                    const detailTr = document.createElement('tr');
                    detailTr.id = `details-${key}`;
                    detailTr.className = 'row-detail';
                    
                    let mcqHtml = `<div class="mcq-review">`;
                    item.studentChoices.forEach((choice, i) => {
                        const isCorrect = choice.userAnswerIndex === answerKey[i];
                        mcqHtml += `<div class="mcq-item">
                            <strong>${i+1}. ${choice.question}</strong><br>
                            <span class="${isCorrect ? 'correct' : 'wrong'}">${choice.userAnswerIndex !== -1 ? choice.options[choice.userAnswerIndex] : 'No Answer'}</span>
                            ${!isCorrect ? '<br><small>Correct: ' + choice.options[answerKey[i]] + '</small>' : ''}
                        </div>`;
                    });
                    mcqHtml += `</div>`;

                    detailTr.innerHTML = `
                        <td colspan="7">
                            <div class="grading-box">
                                <button class="btn-main" style="width:auto; float:right; background:#e67e22;" onclick="sendReport('${key}', ${totalScore}, ${currentGrade}, ${calculatedMcqScore})">Email Report</button>
                                <h3>Scenario: ${item.scenario.title}</h3>
                                <p><strong>Security:</strong> ${item.scenario.security}</p>
                                <p><strong>SDLC:</strong> ${item.scenario.sdlc}</p>
                                <p><strong>HCI:</strong> ${item.scenario.hci}</p>
                                <div style="margin-top:20px; background:#f8fafc; padding:15px; border-radius:12px;">
                                    Scenario Score (0-10): <input type="number" id="sc-${key}" value="${scScore}" style="width:60px;">
                                    <button class="btn-main" style="width:auto; margin-left:10px;" onclick="saveGrade('${key}', ${calculatedMcqScore})">Save Grade</button>
                                </div>
                                ${mcqHtml}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });
        }

        function toggleDetails(key) {
            const el = document.getElementById(`details-${key}`);
            const visible = el.style.display === 'table-row';
            document.querySelectorAll('.row-detail').forEach(r => r.style.display = 'none');
            el.style.display = visible ? 'none' : 'table-row';
        }

        function saveGrade(key, mcq) {
            const sc = parseFloat(document.getElementById(`sc-${key}`).value) || 0;
            db.ref('quiz_results/' + key).update({ scenarioScore: sc, isGraded: true });
        }

        function deleteRecord(key) { if(confirm("Delete?")) db.ref('quiz_results/' + key).remove(); }

        function sendReport(key, total, grade, mcq) {
            db.ref('quiz_results/' + key).once('value', snap => {
                const item = snap.val();
                let report = `Report: ${item.user.fname}\nScore: ${total}/40\nGrade: ${grade}\n\n`;
                // Add details logic here...
                fetch("https://formsubmit.co/ajax/mesuesinformatike@gmail.com", {
                    method: "POST",
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({_subject: `Quiz: ${item.user.fname}`, report: report})
                }).then(() => alert("Sent!"));
            });
        }
    </script>
</body>
</html>
