<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Total 40 Pts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1200px; }
        .results-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .results-table th, .results-table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .results-table th { background-color: var(--primary); color: white; }
        .row-detail { background-color: #fcfcfc; display: none; }
        .grading-box { background: white; padding: 20px; border: 2px solid var(--accent); border-radius: 12px; margin: 10px 0; }
        .mcq-review { border-top: 1px solid #eee; margin-top: 20px; padding-top: 20px; }
        .mcq-item { margin-bottom: 10px; font-size: 0.9rem; }
        .correct { color: green; font-weight: bold; }
        .wrong { color: red; font-weight: bold; }
        .btn-email { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="container admin-container">
        <!-- Admin Login -->
        <div id="admin-login" class="login-box">
            <h2 style="text-align:center;">Admin Login</h2>
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="Password">
            </div>
            <button id="login-btn" class="btn-main">Login</button>
        </div>

        <!-- Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <h1>Teacher Dashboard (Max 40 Pts)</h1>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>MCQ (30)</th>
                        <th>Scenario (10)</th>
                        <th>Total (40)</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        document.getElementById('login-btn').onclick = () => {
            if (document.getElementById('admin-password').value === 'admin') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadResults();
            }
        };

        function getGrade(score) {
            if (score <= 10) return 4;
            if (score <= 15) return 5;
            if (score <= 20) return 6;
            if (score <= 25) return 7;
            if (score <= 30) return 8;
            if (score <= 36) return 9;
            return 10;
        }

        function loadResults() {
            firebase.database().ref('quiz_results').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('admin-tbody');
                tbody.innerHTML = '';
                if (!data) return;

                Object.keys(data).sort((a,b) => new Date(data[b].timestamp) - new Date(data[a].timestamp)).forEach(key => {
                    const item = data[key];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.user.fname} ${item.user.lname}</td>
                        <td>${item.mcqScore}</td>
                        <td>${item.scenarioScore || 0}</td>
                        <td><strong>${item.totalScore || item.mcqScore}</strong></td>
                        <td style="font-weight:bold; color:var(--accent);">Grade: ${item.totalGrade || item.mcqGrade}</td>
                        <td style="color:${item.isGraded ? 'green' : 'red'}">${item.isGraded ? 'Graded' : 'Pending'}</td>
                        <td><button class="btn-main" style="width:auto; padding:5px 10px;" onclick="toggleDetails('${key}')">Details ▼</button></td>
                    `;
                    tbody.appendChild(tr);

                    const detailTr = document.createElement('tr');
                    detailTr.id = `details-${key}`;
                    detailTr.className = 'row-detail';
                    
                    let mcqHtml = `<div class="mcq-review"><h4>MCQ Full Breakdown (Part A)</h4>`;
                    item.details.forEach((det, i) => {
                        mcqHtml += `<div class="mcq-item">${i+1}. ${det.question}<br>
                                    - Answer: <span class="${det.isCorrect ? 'correct' : 'wrong'}">${det.userAnswer}</span> 
                                    ${!det.isCorrect ? '(Correct: '+det.correctAnswer+')' : ''}</div>`;
                    });
                    mcqHtml += `</div>`;

                    detailTr.innerHTML = `
                        <td colspan="7">
                            <div class="grading-box">
                                <h3>Scenario: ${item.scenario.title}</h3>
                                <p><strong>Security:</strong> ${item.scenario.security}</p>
                                <p><strong>SDLC:</strong> ${item.scenario.sdlc}</p>
                                <p><strong>HCI:</strong> ${item.scenario.hci}</p>
                                <hr>
                                <h4>Grade Scenario (Max 10 Pts)</h4>
                                <input type="number" id="sc-grade-${key}" max="10" min="0" value="${item.scenarioScore || 0}" style="width:80px; padding:8px;">
                                <button class="btn-main" style="width:auto; padding:8px 20px; margin-left:10px;" onclick="submitGrade('${key}', ${item.mcqScore})">Save Grade</button>
                                <button class="btn-main btn-email" style="width:auto; padding:8px 20px; margin-left:10px;" onclick="sendEmailManual('${key}')">Send Email Report</button>
                                ${mcqHtml}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });
        }

        function submitGrade(id, mcqScore) {
            const scScore = parseFloat(document.getElementById(`sc-grade-${id}`).value) || 0;
            const totalScore = mcqScore + scScore;
            const finalGrade = getGrade(totalScore);

            firebase.database().ref('quiz_results/' + id).update({
                scenarioScore: scScore,
                totalScore: totalScore,
                totalGrade: finalGrade,
                isGraded: true
            }).then(() => alert("Grade Updated! Total Grade: " + finalGrade));
        }

        function sendEmailManual(id) {
            firebase.database().ref('quiz_results/' + id).once('value', (snapshot) => {
                const item = snapshot.val();
                let report = `STUDENT REPORT: ${item.user.fname} ${item.user.lname}\n`;
                report += `FINAL GRADE: ${item.totalGrade || item.mcqGrade}\n`;
                report += `Total Score: ${item.totalScore || item.mcqScore}/40\n\n`;
                // ... rest of email logic ...
                report += `--- PART A: MCQ DETAILS ---\n`;
                item.details.forEach((det, i) => {
                    report += `${i+1}. ${det.question}\n   Ans: ${det.userAnswer} (${det.isCorrect ? 'CORRECT' : 'INCORRECT'})\n`;
                });
                report += `\n--- PART B: SCENARIO (${item.scenario.title}) ---\n`;
                report += `Security: ${item.scenario.security}\nSDLC: ${item.scenario.sdlc}\nHCI: ${item.scenario.hci}\n`;

                fetch("https://formsubmit.co/ajax/mesuesinformatike@gmail.com", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        _subject: `Quiz Result: ${item.user.fname} ${item.user.lname}`,
                        "Final Report": report
                    })
                }).then(() => alert("Detailed Email Sent!"));
            });
        }
    </script>
</body>
</html>
