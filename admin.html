<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Premium v2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --admin-bg: #f8fafc;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
        body { background-color: var(--admin-bg); }
        .admin-container { max-width: 1300px; width: 95%; margin-top: 20px; }
        .dashboard-card { background: white; border-radius: 16px; box-shadow: var(--card-shadow); padding: 30px; border: 1px solid rgba(0,0,0,0.05); }
        .results-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; }
        .results-table th { background: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; padding: 15px; border-bottom: 2px solid #e2e8f0; }
        .results-table td { padding: 18px 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-size: 0.9rem; }
        
        /* Satıra Tıklama Stili */
        .student-row { cursor: pointer; transition: background 0.2s; }
        .student-row:hover { background-color: #f1f5f9 !important; }
        
        .grade-badge { background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
        .status-pill { padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .pill-pending { background: #fff7ed; color: #c2410c; }
        .pill-graded { background: #f0fdf4; color: #15803d; }
        
        .action-btn { border: none; background: none; cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; color: #64748b; }
        .action-btn:hover { background: #e2e8f0; color: var(--accent); }
        .btn-delete:hover { color: var(--error); background: #fef2f2; }
        
        .row-detail { background-color: #fdfdfd; display: none; }
        .grading-box { background: white; padding: 25px; border: 1px solid #e2e8f0; border-radius: 16px; margin: 10px 15px 25px 15px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        
        .mcq-review { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 25px; }
        .mcq-item { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #f1f5f9; font-size: 0.85rem; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container admin-container">
        <!-- Admin Login -->
        <div id="admin-login" class="login-box dashboard-card" style="max-width: 400px; margin: 100px auto;">
            <h2 style="text-align:center; margin-bottom: 25px;">Teacher Access</h2>
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="Password" style="border: 1px solid #e2e8f0; padding: 14px;">
            </div>
            <button id="login-btn" class="btn-main" style="padding: 14px; border-radius: 12px;">Unlock Dashboard</button>
        </div>

        <!-- Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <div class="dashboard-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h1 style="margin: 0; text-align: left; font-size: 1.6rem;">Exam Management</h1>
                    <button onclick="location.reload()" class="action-btn" style="font-size: 0.9rem;"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Class</th>
                            <th>MCQ (30)</th>
                            <th>SC (10)</th>
                            <th>Total</th>
                            <th>Grade</th>
                            <th>Status</th>
                            <th style="text-align:center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const passwordInput = document.getElementById('admin-password');
        passwordInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('login-btn').click(); });

        document.getElementById('login-btn').onclick = () => {
            if (passwordInput.value === 'admin') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadResults();
            } else { alert("Access Denied"); }
        };

        function getGrade(score) {
            if (score <= 10) return 4;
            if (score <= 15) return 5;
            if (score <= 20) return 6;
            if (score <= 25) return 7;
            if (score <= 30) return 8;
            if (score <= 36) return 9;
            return 10;
        }

        function loadResults() {
            firebase.database().ref('quiz_results').on('value', (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('admin-tbody');
                tbody.innerHTML = '';
                if (!data) return;

                Object.keys(data).sort((a,b) => new Date(data[b].timestamp) - new Date(data[a].timestamp)).forEach(key => {
                    const item = data[key];
                    
                    // Main Row
                    const tr = document.createElement('tr');
                    tr.className = 'student-row';
                    tr.onclick = (e) => {
                        // Don't toggle if clicking a button
                        if (e.target.closest('.action-btn')) return;
                        toggleDetails(key);
                    };

                    tr.innerHTML = `
                        <td style="font-weight: 600;">${item.user.fname} ${item.user.lname}</td>
                        <td>${item.user.classInfo}</td>
                        <td>${item.mcqScore}</td>
                        <td>${item.scenarioScore || 0}</td>
                        <td><strong style="color:var(--primary)">${item.totalScore || item.mcqScore}</strong></td>
                        <td><span class="grade-badge">${item.totalGrade || item.mcqGrade}</span></td>
                        <td><span class="status-pill ${item.isGraded ? 'pill-graded' : 'pill-pending'}">${item.isGraded ? 'Graded' : 'Pending'}</span></td>
                        <td style="text-align:center;">
                            <button class="action-btn" onclick="toggleDetails('${key}')" title="View Details"><i class="fas fa-chevron-down"></i></button>
                            <button class="action-btn btn-delete" onclick="deleteRecord('${key}')" title="Delete"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);

                    // Detail Row
                    const detailTr = document.createElement('tr');
                    detailTr.id = `details-${key}`;
                    detailTr.className = 'row-detail';
                    
                    let mcqHtml = `<div class="mcq-review">`;
                    item.details.forEach((det, i) => {
                        mcqHtml += `<div class="mcq-item">
                                    <div style="font-weight:700; margin-bottom:5px;">${i+1}. ${det.question}</div>
                                    <div class="${det.isCorrect ? 'correct' : 'wrong'}"><i class="fas ${det.isCorrect ? 'fa-check' : 'fa-times'}"></i> ${det.userAnswer}</div>
                                    ${!det.isCorrect ? '<div style="font-size:0.75rem; color:#64748b; margin-top:5px;">Correct: '+det.correctAnswer+'</div>' : ''}
                                    </div>`;
                    });
                    mcqHtml += `</div>`;

                    detailTr.innerHTML = `
                        <td colspan="8">
                            <div class="grading-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:15px; margin-bottom:15px;">
                                    <h3 style="margin:0; font-size:1.1rem; color:var(--primary);">Scenario: ${item.scenario.title}</h3>
                                    <button class="btn-main btn-email" style="width:auto; margin:0; padding:8px 15px; font-size:0.8rem; background:#e67e22;" onclick="sendEmailManual('${key}')"><i class="fas fa-paper-plane"></i> Send Email Report</button>
                                </div>
                                <div style="margin-bottom: 25px; font-size: 0.95rem; line-height: 1.6; color:#475569;">
                                    <p><strong>Security:</strong> ${item.scenario.security}</p>
                                    <p><strong>SDLC:</strong> ${item.scenario.sdlc}</p>
                                    <p><strong>HCI:</strong> ${item.scenario.hci}</p>
                                </div>
                                <div style="background: #f8fafc; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #e2e8f0;">
                                    <strong>Assign Scenario Score (0-10):</strong>
                                    <input type="number" id="sc-grade-${key}" max="10" min="0" value="${item.scenarioScore || 0}" style="width:70px; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">
                                    <button class="btn-main" style="width:auto; margin:0; padding:10px 20px;" onclick="submitGrade('${key}', ${item.mcqScore})">Update Final Grade</button>
                                </div>
                                <h4 style="margin: 30px 0 10px 0; font-size: 1rem; color: #64748b;">Multiple Choice Breakdown</h4>
                                ${mcqHtml}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(detailTr);
                });
            });
        }

        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            const isVisible = el.style.display === 'table-row';
            
            // Close all others for a cleaner look
            document.querySelectorAll('.row-detail').forEach(row => row.style.display = 'none');
            document.querySelectorAll('.fa-chevron-up').forEach(icon => {
                icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
            });

            // Toggle current
            el.style.display = isVisible ? 'none' : 'table-row';
            
            // Update icon
            const row = el.previousElementSibling;
            const icon = row.querySelector('.fa-chevron-down, .fa-chevron-up');
            if (icon) {
                icon.classList.toggle('fa-chevron-down', isVisible);
                icon.classList.toggle('fa-chevron-up', !isVisible);
            }
        }

        function deleteRecord(id) {
            if (confirm("Delete this student record forever?")) {
                firebase.database().ref('quiz_results/' + id).remove()
                    .then(() => alert("Deleted."));
            }
        }

        function submitGrade(id, mcqScore) {
            const scScore = parseFloat(document.getElementById(`sc-grade-${id}`).value) || 0;
            const totalScore = mcqScore + scScore;
            const finalGrade = getGrade(totalScore);

            firebase.database().ref('quiz_results/' + id).update({
                scenarioScore: scScore,
                totalScore: totalScore,
                totalGrade: finalGrade,
                isGraded: true
            }).then(() => alert("Grade Updated! Total: " + totalScore + " | Grade: " + finalGrade));
        }

        function sendEmailManual(id) {
            firebase.database().ref('quiz_results/' + id).once('value', (snapshot) => {
                const item = snapshot.val();
                let report = `EXAM REPORT: ${item.user.fname} ${item.user.lname}\nFINAL GRADE: ${item.totalGrade || item.mcqGrade}\nTOTAL SCORE: ${item.totalScore || item.mcqScore}/40\n\n`;
                report += `--- MCQ DETAILS ---\n`;
                item.details.forEach((det, i) => report += `${i+1}. ${det.question}\n   Ans: ${det.userAnswer} (${det.isCorrect ? 'CORRECT' : 'INCORRECT'})\n`);
                report += `\n--- SCENARIO ---\nSecurity: ${item.scenario.security}\nSDLC: ${item.scenario.sdlc}\nHCI: ${item.scenario.hci}\n`;

                fetch("https://formsubmit.co/ajax/mesuesinformatike@gmail.com", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ _subject: `Report: ${item.user.fname} ${item.user.lname}`, Report: report })
                }).then(() => alert("Email Sent!"));
            });
        }
    </script>
</body>
</html>
