<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Quiz (40 Pts)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-btns { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn-nav { flex: 1; background: #95a5a6; padding: 10px; border: none; color: white; border-radius: 8px; cursor: pointer; }
        .btn-nav:hover { background: #7f8c8d; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen">
            <h1>English Mastery Quiz</h1>
            <p style="text-align:center;">Total Score: 40 Points (30 MCQ + 10 Scenario)</p>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="fname" placeholder="Enter your first name">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Enter your last name">
            </div>
            <div class="form-group">
                <label>Class / Group</label>
                <input type="text" id="class-info" placeholder="e.g. 10-A">
            </div>
            <button id="start-btn" class="btn-main">Start Exam</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <div>Question: <span id="q-count">1/20</span></div>
                <div>Timer: <span id="q-timer">0s</span></div>
            </div>
            <div class="question-card">
                <h2 id="question-text">Loading...</h2>
                <div id="options-grid" class="options-grid"></div>
            </div>
            <div class="nav-btns">
                <button id="prev-btn" class="btn-nav">◄ Previous</button>
                <button id="next-btn" class="btn-nav">Next ►</button>
            </div>
        </div>

        <!-- Scenario Screen -->
        <div id="scenario-screen" class="hidden">
            <h1>Part B: Scenario Task (10 Pts)</h1>
            <div class="report-section">
                <h3 id="scenario-title">Scenario Name</h3>
                <p id="scenario-desc" style="font-style: italic; color: #666;"></p>
                <hr>
                <div class="form-group">
                    <label>1. Security Risk & Solution:</label>
                    <textarea id="ans-security" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>2. Design & Testing Phases:</label>
                    <textarea id="ans-sdlc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>3. HCI / UI Improvement:</label>
                    <textarea id="ans-hci" rows="3"></textarea>
                </div>
            </div>
            <button id="submit-scenario-btn" class="btn-main">Submit Final Exam</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden">
            <h1>Exam Completed</h1>
            <div class="report-section">
                <h3>Performance Summary</h3>
                <div class="summary-grid">
                    <div class="stat-card">
                        <div class="stat-label">MCQ Score (30)</div>
                        <div id="final-score" class="stat-val">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Time</div>
                        <div id="total-time" class="stat-val">0s</div>
                    </div>
                </div>
                <p style="text-align:center; color:#e67e22; font-weight:bold; margin-top:15px;">Your Scenario answers have been sent for grading (Max 10 Pts).</p>
            </div>
            <button onclick="location.reload()" class="btn-main" style="margin-top:20px; background:#7f8c8d;">Close</button>
        </div>

        <div style="text-align: center; margin-top: 50px; opacity: 0.5;">
            <a href="admin.html" style="color: #666; font-size: 0.8rem; text-decoration: none;">Admin Login</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
