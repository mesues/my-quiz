<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen">
            <h1>English Mastery Quiz</h1>
            <p style="text-align:center;">Please enter your details to begin the exam.</p>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="fname" placeholder="Enter your first name">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Enter your last name">
            </div>
            <div class="form-group">
                <label>Class / Group</label>
                <input type="text" id="class-info" placeholder="e.g. 10-A, 12-B">
            </div>
            <button id="start-btn" class="btn-main">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <div>Question: <span id="q-count">1/5</span></div>
                <div>Timer: <span id="q-timer">0s</span></div>
            </div>
            <div class="question-card">
                <h2 id="question-text">Loading question...</h2>
                <div id="options-grid" class="options-grid"></div>
            </div>
            <button id="next-btn" class="btn-main hidden">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden">
            <h1>Exam Report</h1>
            
            <!-- Part 1: Summary -->
            <div class="report-section">
                <h3>Part 1: Performance Summary</h3>
                <div class="summary-grid">
                    <div class="stat-card">
                        <div class="stat-label">Final Score</div>
                        <div id="final-score" class="stat-val">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Correct/Total</div>
                        <div id="correct-count" class="stat-val">0/5</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Time</div>
                        <div id="total-time" class="stat-val">0s</div>
                    </div>
                </div>
            </div>

            <!-- Part 2: Detailed Review -->
            <div class="report-section">
                <h3>Part 2: Question Breakdown</h3>
                <table class="detail-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Status</th>
                            <th>Your Answer</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="details-body"></tbody>
                </table>
            </div>

            <button onclick="location.reload()" class="btn-main" style="margin-top:20px; background:#7f8c8d;">Retake Quiz</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <!-- Config and Logic -->
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
